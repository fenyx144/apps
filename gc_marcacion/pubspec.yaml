name: marcacion
description: Marcación de desayuno, almuerzo y cena del personal de despacho
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  device_info_plus: ^12.3.0
  get: ^4.7.3
  shared_preferences: ^2.5.4
  http: ^1.6.0
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  crypto: ^3.0.6
  pointycastle: ^4.0.0
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  mobile_scanner: ^7.0.1
  android_id: ^0.5.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_grs.png
    - assets/images/logo_encabezado.png
    - assets/icon/icon.png
    - assets/gifs/gallina.gif

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
