name: gc_mortalidad
description: "App móvil de registro de mortalidad avícola - GRS Sanidad"
publish_to: 'none'
version: 1.0.3+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  provider: ^6.1.5+1
  device_info_plus: ^12.3.0
  get: ^4.7.3
  shared_preferences: ^2.5.4
  http: ^1.6.0
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1
  fl_chart: ^1.1.1
  pro_image_editor: ^11.18.3
  intl: ^0.20.2
  crypto: ^3.0.6
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_grs.png
    - assets/images/logo_encabezado.png
    - assets/gifs/gallina.gif
    - assets/icon/icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_background: "#ffffff"
